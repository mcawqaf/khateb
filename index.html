<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>برنامج (إعداد) لتأهيل الخطباء - الدورة الخامسة 1448هـ / 2026م | الهيئة العامة للأوقاف والشؤون الإسلامية</title>
    <meta name="description" content="البوابة الإلكترونية للتسجيل في برنامج (إعداد) لتأهيل الخطباء - الدورة الخامسة للعام 1448هـ / 2026م بإشراف إدارة الشؤون الثقافية والدعوية بالهيئة العامة للأوقاف والشؤون الإسلامية." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#061526] text-slate-900 font-['Cairo',sans-serif] antialiased selection:bg-[#0284C7] selection:text-white">
    <div id="root"></div>
    <script>
      /*
       * GitHub Pages serves index.html with a ten minute cache, while the
       * bundle it points at is renamed on every deploy. A visitor holding the
       * previous HTML therefore requests a file that no longer exists and gets
       * a blank page until their cache expires.
       *
       * Reload once, past the cache, when a script or stylesheet fails. The
       * sessionStorage guard stops this becoming a loop if the asset is missing
       * for some other reason; it is cleared once the app has actually mounted.
       */
      (function () {
        var KEY = 'khateeb_asset_reload';
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
            location.replace(location.pathname + '?r=' + Date.now() + location.hash);
          },
          true
        );
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.children.length > 0) sessionStorage.removeItem(KEY);
          }, 1000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
